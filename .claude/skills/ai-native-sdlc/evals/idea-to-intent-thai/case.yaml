schema_version: "1.1"
name: idea-to-intent-thai
expected_outcome: |
  An intent.md is created under intent/<date>-<slug>/ describing the problem and desired outcome in the owner's terms (what and why, not how), written in Thai, with explicit assumptions and open questions and status draft. No application code is written yet. The reply explains in plain Thai what the file is, what the owner should check, and what happens after they accept it.
